name: Update nebula profile visuals

on:
  workflow_dispatch:
  schedule:
    # 07:17 Asia/Jakarta (WIB); schedule timing is approximate.
    - cron: "17 0 * * *"

permissions:
  contents: write

jobs:
  update-visuals:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the profile repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build cards from public GitHub repositories
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/generate_cards.py --user AkhtarAriq --out assets

      - name: Animate my own contribution graph
        uses: Platane/snk@v3
        with:
          github_user_name: AkhtarAriq
          outputs: |
            assets/contribution-snake.gif?color_snake=%23F5F6FA&color_dots=%23090A12,%23212446,%233D3883,%23695BD5,%23B79FF8&color_background=%23090A12

      - name: Commit refreshed visuals
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/language-stack.svg assets/language-stack-mobile.svg assets/projects.svg assets/projects-mobile.svg assets/contribution-snake.gif
          if git diff --cached --quiet; then
            echo "No visual changes to commit."
          else
            git commit -m "chore(profile): refresh dynamic cards and contribution snake"
            git push
          fi
