name: Profile metrics

on:
  schedule:
    # Daily at 07:17 WIB (UTC+7); GitHub may delay scheduled runs.
    - cron: "17 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  metrics:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Generate profile metrics
        uses: lowlighter/metrics@latest
        with:
          user: AkhtarAriq
          token: ${{ secrets.METRICS_TOKEN }}
          committer_token: ${{ secrets.GITHUB_TOKEN }}
          filename: github-metrics.svg
          template: classic
          base: activity, community, repositories
          config_timezone: Asia/Jakarta
          config_order: languages, habits, base.activity, base.community, base.repositories
          plugin_languages: "yes"
          plugin_languages_limit: 6
          plugin_languages_details: percentage
          plugin_habits: "yes"
          plugin_habits_days: 30
          plugin_habits_facts: "no"
          plugin_habits_charts: "yes"
          plugin_habits_charts_type: graph
          plugin_habits_languages_limit: 0
